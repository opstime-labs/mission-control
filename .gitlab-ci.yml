# ==============================================================================
# GITLAB CI/CD SPEC INPUTS (Enables Native GitLab UI Form Controls)
# ==============================================================================
spec:
  inputs:
    ENABLE_BUILD_AND_TEST:
      type: boolean
      default: true
      description: "Compile .NET solution, enforce zero warnings, execute TRX test suite, and run SonarQube SAST"
    ENABLE_TRIVY_SCAN:
      type: boolean
      default: false
      description: "Execute Trivy container vulnerability scan (Hard gate: breaks pipeline on HIGH or CRITICAL CVEs)"
    ENABLE_INGRESS_HEALTH_CHECK:
      type: boolean
      default: true
      description: "Verify service ingress readiness on port 8085 and trigger automated recovery ladder on failure"
    ENABLE_RAW_RELEASE_PUBLISH:
      type: boolean
      default: false
      description: "Package framework-dependent binary archive (.tar.gz) and SHA-256 digest to Nexus raw-hosted"
    ENABLE_CONTAINER_PUBLISH:
      type: boolean
      default: true
      description: "Build and push multi-architecture (amd64/arm64) Ubuntu Chiseled OCI image to Nexus registry"
    DEPLOY_STRATEGY:
      type: string
      default: "ANSIBLE"
      options:
        - "ANSIBLE"
        - "STANDALONE_SSH"
        - "SKIP"
      description: "Orchestration mechanism for targeting the physical SIL hardware node"
    DEPLOY_TARGET_HOST:
      type: string
      default: "10.0.0.163"
      description: "Physical IP or FQDN of the target SIL node (Raspberry Pi 400)"
    INGRESS_PORT:
      type: string
      default: "8085"
      description: "Unprivileged NGINX reverse-proxy ingress listener port on target SIL node"
    HEALTH_CHECK_ENDPOINT:
      type: string
      default: "/health"
      description: "Health check endpoint path for ingress verification"
---

# ==============================================================================
# PIPELINE STAGES & RUNTIME COORDINATES
# ==============================================================================
stages:
  - audit
  - build_and_test
  - publish_raw
  - container_gate
  - release_readiness
  - deploy_sil
  - verify_and_recover
  - audit_summary

variables:
  # .NET Build Mechanics & Telemetry Baselines
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  DOTNET_NOLOGO: "true"
  NUGET_XMLDOC_MODE: "skip"
  ContinuousIntegrationBuild: "true"

  # Internal Artifact & Code Analysis Endpoints
  REGISTRY_HOST: "nexus.homelab.local:8082"
  IMAGE_NAME: "mission-control/sensor-gateway"
  NEXUS_RAW_BASE: "http://10.0.0.182:8081/repository/raw-hosted"
  DOTNET_BUILDER_IMAGE: "nexus.homelab.local:8082/infrastructure/dotnet-builder:10.0-jdk21-sonar9.0.1-r1"
  SONAR_HOST_URL: "http://10.0.0.182:9000"
  SONAR_PROJECT_KEY: "mission-control-api"
  JIRA_API_URL: "https://cp4learning.atlassian.net/rest/api/2/issue"

  # SIL Deployment Target Details
  DEPLOY_SIL_AGENT_NAME: "sil-agent-01"
  DEPLOY_HOST_USER: "deployer"

default:
  tags:
    - self-hosted
    - homelab

# ==============================================================================
# STAGE 1: TRACEABILITY & IEEE 828 AUDIT GATE
# ==============================================================================
stage_1_audit_gate:
  stage: audit
  script:
    - set -euo pipefail
    - echo "=== [STAGE 1] ASSERTING JIRA TRACEABILITY BASELINE ==="
    - COMMIT_LOGS=$(git log -5 --pretty=%B)
    - SEARCH_STR="${CI_COMMIT_REF_NAME}${COMMIT_LOGS}"
    - |
      if [[ "${SEARCH_STR}" =~ ([A-Za-z]{2,10}-[0-9]+) ]]; then
        JIRA_KEY=$(echo "${BASH_REMATCH[1]}" | tr '[:lower:]' '[:upper:]')
        echo "Traceability Audit Gate: PASSED"
        echo "Resolved Jira Work Item: ${JIRA_KEY}"
      else
        echo "CONFIGURATION AUDIT FAILURE: No Jira issue key found. Controlled Goods and IEEE 828 standards mandate an active tracking ticket." >&2
        exit 1
      fi
    - SHORT_SHA=$(git rev-parse --short=7 HEAD)
    - TARGET_TAG="${CI_PIPELINE_IID}-${SHORT_SHA}"
    - echo "JIRA_KEY=${JIRA_KEY}" >> pipeline.env
    - echo "SHORT_SHA=${SHORT_SHA}" >> pipeline.env
    - echo "TARGET_RELEASE_TAG=${TARGET_TAG}" >> pipeline.env
    - echo "DEPLOY_HOST_IP=$[[ inputs.DEPLOY_TARGET_HOST ]]" >> pipeline.env
    - echo "INGRESS_PORT=$[[ inputs.INGRESS_PORT ]]" >> pipeline.env
    - echo "HEALTH_CHECK_ENDPOINT=$[[ inputs.HEALTH_CHECK_ENDPOINT ]]" >> pipeline.env
  artifacts:
    reports:
      dotenv: pipeline.env

# ==============================================================================
# STAGE 2: .NET 10 RESTORE, BUILD, TEST & SONARQUBE SAST
# ==============================================================================
stage_2_build_and_test:
  stage: build_and_test
  needs: [stage_1_audit_gate]
  rules:
    - if: '"$[[ inputs.ENABLE_BUILD_AND_TEST ]]" == "true"'
  script:
    - set -euo pipefail
    - echo "=== [STAGE 2] DETERMINISTIC RESTORE, BUILD & SAST ==="
    - echo "$NEXUS_PASS" | docker login -u "$NEXUS_USER" --password-stdin "$REGISTRY_HOST"
    - trap 'docker logout "$REGISTRY_HOST" 2>/dev/null || true' EXIT
    - HOST_UID=$(id -u)
    - HOST_GID=$(id -g)
    - |
      docker run --rm \
        --user root \
        --network host \
        -v "$CI_PROJECT_DIR:/workspace" \
        -w /workspace \
        --tmpfs /tmp:rw,exec,nosuid,size=2048m \
        -e HOME=/tmp \
        -e DOTNET_CLI_HOME=/tmp/.dotnet \
        -e NUGET_PACKAGES=/tmp/.nuget/packages \
        -e PATH="/usr/local/bin:/usr/bin:/bin" \
        -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
        -e ContinuousIntegrationBuild=true \
        -e SONAR_TOKEN="${SONAR_TOKEN}" \
        -e SONAR_HOST_URL="${SONAR_HOST_URL}" \
        -e SONAR_PROJECT_KEY="${SONAR_PROJECT_KEY}" \
        "$DOTNET_BUILDER_IMAGE" \
        bash -c '
          set -euo pipefail
          chmod -R a+rx /usr/local/bin/.store/dotnet-sonarscanner 2>/dev/null || true

          echo "--> Restoring dependencies in locked mode..."
          dotnet restore MissionControl.sln --locked-mode --configfile nuget.config

          echo "--> Initializing SonarQube Scanner hook..."
          dotnet-sonarscanner begin \
            /k:"${SONAR_PROJECT_KEY}" \
            /d:sonar.host.url="${SONAR_HOST_URL}" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.cs.vstest.reportsPaths="/workspace/TestResults/*.trx" \
            /d:sonar.cs.opencover.reportsPaths="/workspace/TestResults/**/coverage.opencover.xml" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.scanner.scanAll=false

          echo "--> Compiling with zero warnings and deterministic flags..."
          dotnet build MissionControl.sln -c Release --no-restore /p:TreatWarningsAsErrors=true /p:ContinuousIntegrationBuild=true /p:Deterministic=true

          echo "--> Executing test suite with TRX and Coverage..."
          mkdir -p /workspace/TestResults
          dotnet test tests/MissionControl.Tests/MissionControl.Tests.csproj \
            -c Release --no-build \
            --logger "trx;LogFileName=test_results.trx" \
            --results-directory /workspace/TestResults \
            --collect:"XPlat Code Coverage" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

          echo "--> Concluding SonarQube SAST evaluation..."
          dotnet-sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

          echo "--> Packaging framework-dependent binary release layout..."
          rm -rf /workspace/publish_raw
          dotnet publish src/MissionControl.Api/MissionControl.Api.csproj -c Release --no-restore -o /workspace/publish_raw /p:ContinuousIntegrationBuild=true /p:UseAppHost=false

          chown -R '"${HOST_UID}:${HOST_GID}"' /workspace
        '
  artifacts:
    when: always
    reports:
      junit: TestResults/*.trx
    paths:
      - publish_raw/
      - TestResults/*.trx
    expire_in: 7 days

# ==============================================================================
# STAGE 3: PUBLISH RAW BINARY RELEASE ARCHIVE TO NEXUS
# ==============================================================================
stage_3_publish_raw:
  stage: publish_raw
  needs: [stage_1_audit_gate, stage_2_build_and_test]
  rules:
    - if: '($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master") && "$[[ inputs.ENABLE_RAW_RELEASE_PUBLISH ]]" == "true"'
  script:
    - set -euo pipefail
    - echo "=== [STAGE 3] PACKAGING RAW RELEASE BINARIES ==="
    - RELEASE_DIR="$CI_PROJECT_DIR/release_dist"
    - mkdir -p "${RELEASE_DIR}"
    - ARTIFACT_NAME="mission-control-api-${TARGET_RELEASE_TAG}.tar.gz"
    - CHECKSUM_NAME="${ARTIFACT_NAME}.sha256"
    - tar -czf "${RELEASE_DIR}/${ARTIFACT_NAME}" -C "$CI_PROJECT_DIR/publish_raw" .
    - cd "${RELEASE_DIR}"
    - sha256sum "${ARTIFACT_NAME}" > "${CHECKSUM_NAME}"
    - UPLOAD_URL="${NEXUS_RAW_BASE}/sensor-gateway/${CI_PIPELINE_IID}"
    - echo "--> Uploading tarball to Nexus raw feed..."
    - curl -s -f -u "$NEXUS_USER:$NEX