---
# ==============================================================================
# PHASE 1: DIRECTORY STRUCTURE & INITIALIZATION
# ==============================================================================
- name: Verify deterministic deployment parameters
  ansible.builtin.assert:
    that:
      - target_tag is defined
      - target_tag | length > 0
    fail_msg: "Target tag missing. Auditable baselines require an explicit tag."

- name: Create base application directory with deployer ownership
  ansible.builtin.file:
    path: /opt/mission-control
    state: directory
    owner: deployer
    group: deployer
    mode: '0755'
  become: yes

- name: Create persistent ingress subdirectories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: deployer
    group: deployer
    mode: '0755'
  loop:
    - /opt/mission-control/nginx
    - /opt/mission-control/nginx/conf.d
  become: no

# ==============================================================================
# PHASE 2: APPLICATION RUNTIME INSTANTIATION (IDLE SLOT)
# ==============================================================================
- name: Ensure stale candidate slot container is purged prior to launch
  community.docker.docker_container:
    name: "mc-{{ idle_slot }}"
    state: absent
  become: no

- name: Start mission workload on candidate idle slot ({{ idle_slot }}:{{ idle_port }})
  community.docker.docker_container:
    name: "mc-{{ idle_slot }}"
    image: "{{ registry_host }}/{{ image_name }}:{{ target_tag }}"
    state: started
    recreate: yes
    restart_policy: always
    published_ports:
      - "127.0.0.1:{{ idle_port }}:8080"
    env:
      ASPNETCORE_ENVIRONMENT: "Production"
      DEPLOYMENT_SLOT: "{{ idle_slot }}"
      BASELINE_TAG: "{{ target_tag }}"
    memory: "512m"
  become: no

- name: Execute automated readiness probe on candidate slot
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ idle_port }}/health"
    status_code: 200
  register: health_check
  retries: 10
  delay: 2
  until: health_check.status == 200
  become: no

# ==============================================================================
# PHASE 3: STAGE INGRESS ROUTE & MANAGE PROXY CONTAINER
# ==============================================================================
- name: Stage dynamic upstream route template into conf.d
  ansible.builtin.template:
    src: gateway.conf.j2
    dest: /opt/mission-control/nginx/conf.d/gateway.conf
    owner: deployer
    group: deployer
    mode: '0644'
  become: no

- name: Ensure containerized reverse proxy (mc-proxy) is active
  community.docker.docker_container:
    name: mc-proxy
    image: nginx:1.27-alpine
    state: started
    restart_policy: always
    published_ports:
      - "80:80"
    volumes:
      - /opt/mission-control/nginx/conf.d:/etc/nginx/conf.d:ro
    etc_hosts:
      host.docker.internal: host-gateway
  become: no

- name: Validate NGINX syntax inside container
  ansible.builtin.command: docker exec mc-proxy nginx -t
  become: no
  changed_when: false

- name: Trigger atomic zero-downtime traffic cutover
  ansible.builtin.command: docker exec mc-proxy nginx -s reload
  become: no

# ==============================================================================
# PHASE 4: STALE WORKLOAD EVICTION & STATE PERSISTENCE
# ==============================================================================
- name: Evict stale slot container (mc-{{ slot }})
  community.docker.docker_container:
    name: "mc-{{ slot }}"
    state: absent
  become: no
  ignore_errors: yes

- name: Persist active slot state to baseline file
  ansible.builtin.copy:
    content: "{{ idle_slot }}"
    dest: /opt/mission-control/active_slot
    owner: deployer
    group: deployer
    mode: '0644'
  become: no