---
# ==============================================================================
# PHASE 0: HARDWARE-IN-THE-LOOP (HIL) SENSOR & HOST PRE-FLIGHT DIAGNOSTICS
# ==============================================================================
- name: Probe required hardware bus device nodes
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "/dev/i2c-1"
    - "/dev/gpiomem"
  register: hil_devices_probe

- name: Gate deployment on physical device node availability
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: "CRITICAL HIL FAILURE: Hardware device [{{ item.item }}] is not bound on the target node."
    success_msg: "Hardware device [{{ item.item }}] present and bound."
  loop: "{{ hil_devices_probe.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Inspect target node disk capacity on deployment partition (/opt)
  ansible.builtin.shell: "df --output=avail -k /opt | tail -n 1"
  register: opt_avail_kb
  changed_when: false
  become: no

- name: Gate deployment if target filesystem free space is below threshold (< 1GB)
  ansible.builtin.assert:
    that:
      - (opt_avail_kb.stdout | trim | int) >= 1048576
    fail_msg: "CRITICAL: Target node /opt partition has less than 1GB free (Available: {{ opt_avail_kb.stdout | trim }} KB)."
    success_msg: "Disk capacity verified: {{ (opt_avail_kb.stdout | trim | int / 1024) | round(2) }} MB available on /opt."

- name: Probe CPU thermal envelope on target embedded hardware (Broadcom/ARM/x86)
  ansible.builtin.shell: |
    if [ -f /sys/class/thermal/thermal_zone0/temp ]; then
      cat /sys/class/thermal/thermal_zone0/temp
    elif command -v vcgencmd >/dev/null 2>&1; then
      vcgencmd measure_temp | grep -o -E '[0-9.]+' | awk '{print $1 * 1000}'
    else
      echo "45000"
    fi
  register: host_temp_raw
  changed_when: false
  become: no

- name: Gate deployment if node thermal limit is exceeded (> 75°C)
  ansible.builtin.assert:
    that:
      - (host_temp_raw.stdout | trim | int) <= 75000
    fail_msg: "CRITICAL: Thermal throttling danger! Node temperature is {{ (host_temp_raw.stdout | trim | int / 1000) | round(1) }}°C. Threshold is 75°C."
    success_msg: "Thermal envelope nominal: {{ (host_temp_raw.stdout | trim | int / 1000) | round(1) }}°C."
    
# ==============================================================================
# PHASE 1: DISCOVERY & QUARANTINE RECOVERY
# ==============================================================================
- name: Read current active deployment slot from baseline file
  ansible.builtin.slurp:
    src: "{{ app_base_dir }}/active_slot"
  register: active_slot_raw

- name: Normalize active slot state and detect quarantine
  ansible.builtin.set_fact:
    raw_slot: "{{ active_slot_raw.content | b64decode | trim }}"

- name: Evaluate deployment recovery posture
  ansible.builtin.set_fact:
    is_quarantined: "{{ raw_slot not in ['blue', 'green'] }}"
    current_slot: "{{ 'none' if (raw_slot not in ['blue', 'green']) else raw_slot }}"
    target_slot: "{{ 'blue' if (raw_slot not in ['blue', 'green']) else ('green' if raw_slot == 'blue' else 'blue') }}"

- name: Set dynamic slot port mappings safely
  ansible.builtin.set_fact:
    current_port: "{{ slots[current_slot].port if not is_quarantined else 0 }}"
    target_port: "{{ slots[target_slot].port }}"

- name: Inspect Docker bridge network to dynamically resolve Gateway IP
  community.docker.docker_network_info:
    name: bridge
  register: docker_bridge_info

- name: Assign dynamic Docker gateway IP
  ansible.builtin.set_fact:
    docker_gw_ip: "{{ docker_bridge_info.network.IPAM.Config[0].Gateway }}"

- name: Display calculated deployment topology
  ansible.builtin.debug:
    msg: >
      [RECOVERY STATUS: {{ 'QUARANTINE_RECOVERY' if is_quarantined else 'NORMAL_CUTOVER' }}]
      Current: {{ current_slot }} (Port: {{ current_port }}) |
      Deploying Candidate: {{ target_slot }} (Port: {{ target_port }}) |
      Gateway: {{ docker_gw_ip }}

# ==============================================================================
# PHASE 2: IMAGE STAGING & CANDIDATE SLOT STARTUP
# ==============================================================================
- name: Log in to air-gapped Nexus OCI registry on target node
  community.docker.docker_login:
    registry_url: "{{ registry_host }}"
    username: "{{ nexus_user }}"
    password: "{{ nexus_pass }}"
    reauthorize: yes
  become: no

- name: Pull release container image from local Nexus registry
  community.docker.docker_image:
    name: "{{ registry_host }}/{{ image_name }}:{{ target_tag }}"
    source: pull
    force_source: true
  become: no

- name: Log out from Nexus registry to prevent cached credentials at rest
  community.docker.docker_login:
    registry_url: "{{ registry_host }}"
    state: absent
  become: no

- name: Assert deployment target image coordinate is non-empty and well-formed
  ansible.builtin.assert:
    that:
      - target_tag is defined
      - target_tag | length > 0
    fail_msg: "FATAL: 'target_tag' is undefined or empty. Received: '{{ target_tag | default('') }}'"

- name: Construct canonical target image coordinate
  ansible.builtin.set_fact:
    full_image_ref: "{{ registry_host | default('nexus.homelab.local:8082') }}/{{ image_name | default('mission-control/sensor-gateway') }}:{{ target_tag }}"

- name: Debug resolved container image reference
  ansible.builtin.debug:
    msg: "Target container coordinate -> {{ full_image_ref }}"

- name: Ensure target idle slot container is running
  community.docker.docker_container:
    name: "mc-{{ target_slot }}"
    image: "{{ full_image_ref }}"
    state: started
    restart_policy: always
    network_mode: host
    env:
      ASPNETCORE_URLS: "http://0.0.0.0:{{ target_port }}"
      DOTNET_RUNNING_IN_CONTAINER: "true"

- name: Ensure target idle slot container is running
  community.docker.docker_container:
    name: "mc-{{ target_slot }}"
    image: "{{ registry_host }}/{{ image_name }}:{{ target_tag }}"
    state: started
    restart_policy: always
    published_ports:
      - "0.0.0.0:{{ target_port }}:8080"
    env:
      ASPNETCORE_ENVIRONMENT: "Production"
      DEPLOYMENT_SLOT: "{{ target_slot }}"
      BASELINE_TAG: "{{ target_tag }}"
    memory: "512m"
  become: no

- name: Poll target container internal health probe
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ target_port }}/health"
    status_code: 200
    timeout: 3
  register: candidate_health
  retries: 10
  delay: 2
  until: candidate_health.status == 200

- name: Allow Kestrel runtime worker pool to stabilize before ingress cutover
  ansible.builtin.pause:
    seconds: 2

# ==============================================================================
# PHASE 3: ATOMIC INGRESS CUTOVER VIA NGINX
# ==============================================================================
- name: Ensure NGINX conf.d directory exists on host
  ansible.builtin.file:
    path: "{{ app_base_dir }}/nginx/conf.d"
    state: directory
    owner: deployer
    group: deployer
    mode: '0755'
  become: no

- name: Stage dynamic upstream route configuration
  ansible.builtin.template:
    src: gateway.conf.j2
    dest: "{{ app_base_dir }}/nginx/conf.d/gateway.conf"
    owner: deployer
    group: deployer
    mode: '0644'
  become: no

- name: Ensure mc-proxy container is running
  community.docker.docker_container:
    name: mc-proxy
    image: "nginx:1.27-alpine"
    state: started
    restart_policy: always
    published_ports:
      - "{{ ingress_port }}:{{ ingress_port }}"
    volumes:
      - "{{ app_base_dir }}/nginx/conf.d:/etc/nginx/conf.d:ro"
  become: no

- name: Test NGINX configuration syntax inside container
  ansible.builtin.command: docker exec mc-proxy nginx -t
  become: no
  changed_when: false

- name: Signal zero-downtime NGINX reload
  ansible.builtin.command: docker exec mc-proxy nginx -s reload
  become: no

# ==============================================================================
# PHASE 4: STATE RETENTION & SUPERVISOR ACTIVATION
# ==============================================================================
- name: Persist new active deployment slot to disk
  ansible.builtin.copy:
    content: "{{ target_slot }}\n"
    dest: "{{ app_base_dir }}/active_slot"
    owner: "{{ deploy_user | default('deployer') }}"
    group: "{{ deploy_group | default('deployer') }}"
    mode: '0644'
  become: no

- name: Inspect if previous slot container exists
  community.docker.docker_container_info:
    name: "mc-{{ current_slot }}"
  register: prev_container_info
  when: not is_quarantined

- name: Retain previous slot in stopped standby holding state (for instant rollback)
  community.docker.docker_container:
    name: "mc-{{ current_slot }}"
    state: stopped
  when: not is_quarantined and prev_container_info.exists
  become: no

- name: Engage local node autonomous watchdog supervisor
  ansible.builtin.systemd:
    name: sil-watchdog.service
    state: started
  become: yes