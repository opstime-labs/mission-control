version: '3.8'

networks:
  defence-control-plane:
    name: defence-control-plane
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:
  # ----------------------------------------------------------------------------
  # 1. ARTIFACT & OCI REGISTRY TIER: Sonatype Nexus OSS
  # ----------------------------------------------------------------------------
  nexus:
    image: sonatype/nexus3:3.70.1
    container_name: nexus-controller
    restart: always
    user: "200:200"
    environment:
      - INSTALL4J_ADD_VM_PARAMS=-Xms2703m -Xmx2703m -XX:MaxDirectMemorySize=2703m -Djava.util.prefs.userRoot=/nexus-data/javaprefs
    ports:
      - "8081:8081"   # Nexus Web UI, Hosted NuGet, and Raw Binary Feeds
      - "8082:8082"   # Private OCI / Docker Registry v2 Connector
    volumes:
      - /opt/nexus-data:/nexus-data
    networks:
      defence-control-plane:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://127.0.0.1:8081/service/rest/v1/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ----------------------------------------------------------------------------
  # 2. CODE QUALITY & SAST STORAGE: PostgreSQL for SonarQube
  # ----------------------------------------------------------------------------
  sonar-db:
    image: postgres:15-alpine
    container_name: sonarqube-db
    restart: always
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=SonarDefenceSecure2026!
      - POSTGRES_DB=sonarqube
    volumes:
      - /opt/sonarqube/db:/var/lib/postgresql/data
    networks:
      defence-control-plane:
        ipv4_address: 172.28.0.20
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 3. CODE QUALITY & SAST TIER: SonarQube Server
  # ----------------------------------------------------------------------------
  sonarqube:
    image: sonarqube:10.6-community
    container_name: sonarqube-server
    restart: always
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=SonarDefenceSecure2026!
      - SONAR_JDBC_URL=jdbc:postgresql://172.28.0.20:5432/sonarqube
      - SONAR_SEARCH_JAVAADDITIONALOPTS=-Dnode.store.allow_mmap=true
    ports:
      - "9000:9000"   # SonarQube Analysis Web Server & REST API
    volumes:
      - /opt/sonarqube/data:/opt/sonarqube/data
      - /opt/sonarqube/extensions:/opt/sonarqube/extensions
      - /opt/sonarqube/logs:/opt/sonarqube/logs
    networks:
      defence-control-plane:
        ipv4_address: 172.28.0.21
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://127.0.0.1:9000/api/system/status | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ----------------------------------------------------------------------------
  # 4. CI/CD ORCHESTRATION TIER: Jenkins (Docker-out-of-Docker)
  # ----------------------------------------------------------------------------
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins-controller
    restart: always
    user: "1000:998"   # Maps to host UID (chand) and Docker GID (998)
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Dorg.apache.commons.jelly.tags.core.UseDynamicProperties=true
    ports:
      - "8080:8080"   # Jenkins Web UI & Webhook Receiver
      - "50000:50000" # JNLP Agent Connector Port
    volumes:
      - /var/jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
    networks:
      defence-control-plane:
        ipv4_address: 172.28.0.30
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://127.0.0.1:8080/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s