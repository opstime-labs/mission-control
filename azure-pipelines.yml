# =============================================================================
# AZURE DEVOPS DELIVERY PIPELINE: MISSIONCONTROL
# Client Context: Leonardo DRS Systems Integration Lab (SIL) Emulation
# Standard: IEEE 828-2012 Configuration Management & Controlled Goods (CGP)
# Self-Hosted Agent Pool: Homelab Ubuntu Mini PC (10.0.0.182)
# =============================================================================

name: $(Date:yyyyMMdd)$(Rev:.r)-$(Build.SourceBranchName)

trigger:
  branches:
    include:
      - main
      - master
      - feature/*
  paths:
    exclude:
      - '**.md'
      - '**.txt'
      - '**.pdf'
      - '**.docx'
      - '**.rst'
      - '**.adoc'
      - 'docs/**'
      - 'documentation/**'
      - 'wiki/**'

pr:
  branches:
    include:
      - main
      - master

parameters:
  - name: ENABLE_BUILD_AND_TEST
    displayName: 'Execute .NET 10 Build, Tests & SonarQube SAST'
    type: boolean
    default: true
  - name: ENABLE_TRIVY_SCAN
    displayName: 'Enforce Trivy Container Security Gate (Breaks on HIGH/CRITICAL)'
    type: boolean
    default: true
  - name: ENABLE_RAW_RELEASE_PUBLISH
    displayName: 'Publish Raw Binary Archive (.tar.gz + SHA256) to Nexus'
    type: boolean
    default: true
  - name: ENABLE_CONTAINER_PUBLISH
    displayName: 'Publish Multi-Arch Images (amd64/arm64) to Nexus OCI Registry'
    type: boolean
    default: true
  - name: DEPLOY_STRATEGY
    displayName: 'Target SIL Node Deployment Strategy'
    type: string
    default: 'ANSIBLE'
    values:
      - ANSIBLE
      - STANDALONE_SSH
      - SKIP
  - name: DEPLOY_TARGET_HOST
    displayName: 'Target SIL Node IP / FQDN'
    type: string
    default: '10.0.0.163'
  - name: INGRESS_PORT
    displayName: 'Target Ingress Port (NGINX)'
    type: string
    default: '8085'
  - name: HEALTH_CHECK_ENDPOINT
    displayName: 'Health Endpoint Path'
    type: string
    default: '/health'
  - name: ENABLE_INGRESS_HEALTH_CHECK
    displayName: 'Verify Ingress & Execute Recovery Ladder on Failure'
    type: boolean
    default: true

variables:
  # General Runtime & Tooling Baselines
  - name: DOTNET_CLI_TELEMETRY_OPTOUT
    value: '1'
  - name: DOTNET_SKIP_FIRST_TIME_EXPERIENCE
    value: '1'
  - name: DOTNET_NOLOGO
    value: 'true'
  - name: NUGET_XMLDOC_MODE
    value: 'skip'
  - name: ContinuousIntegrationBuild
    value: 'true'
  
  # Network Topology & Artifact Registry Coordinates
  - name: CI_CONTROLLER_HOST
    value: '10.0.0.182'
  - name: REGISTRY_HOST
    value: 'nexus.homelab.local:8082'
  - name: IMAGE_NAME
    value: 'mission-control/sensor-gateway'
  - name: NEXUS_RAW_BASE
    value: 'http://10.0.0.182:8081/repository/raw-hosted'
  - name: DOTNET_BUILDER_IMAGE
    value: 'nexus.homelab.local:8082/infrastructure/dotnet-builder:10.0-jdk21-sonar9.0.1-r1'
  - name: SONAR_HOST_URL
    value: 'http://10.0.0.182:9000'
  - name: SONAR_PROJECT_KEY
    value: 'mission-control-api'
  - name: JIRA_API_URL
    value: 'https://cp4learning.atlassian.net/rest/api/2/issue'

  # SIL Target Topology
  - name: DEPLOY_SIL_AGENT_NAME
    value: 'sil-agent-01'
  - name: DEPLOY_HOST_USER
    value: 'deployer'
  - name: DEPLOY_HOST_IP
    value: '${{ parameters.DEPLOY_TARGET_HOST }}'
  - name: INGRESS_PORT
    value: '${{ parameters.INGRESS_PORT }}'
  - name: HEALTH_CHECK_ENDPOINT
    value: '${{ parameters.HEALTH_CHECK_ENDPOINT }}'

pool:
  name: 'Default' # Self-hosted runner pool on Ubuntu Mini PC

stages:
  # =========================================================================
  # STAGE 1: TRACEABILITY & IEEE 828 AUDIT GATE
  # =========================================================================
  - stage: AuditGate
    displayName: 'Stage 1: Traceability & Audit Gate'
    jobs:
      - job: AssertTraceability
        displayName: 'Assert Jira Traceability'
        steps:
          - checkout: self
            fetchDepth: 50

          - bash: |
              set -euo pipefail
              echo "=== [STAGE 1] ASSERTING JIRA TRACEABILITY BASELINE ==="
              COMMIT_LOGS=$(git log -5 --pretty=%B)
              BRANCH_NAME="$(Build.SourceBranchName)"
              SEARCH_STR="${BRANCH_NAME} ${COMMIT_LOGS}"

              # Regex: 2-10 uppercase letters followed by dash and numbers
              if [[ "${SEARCH_STR}" =~ ([A-Za-z]{2,10}-[0-9]+) ]]; then
                JIRA_KEY=$(echo "${BASH_REMATCH[1]}" | tr '[:lower:]' '[:upper:]')
                echo "Traceability Audit Gate: PASSED"
                echo "Resolved Jira Work Item: ${JIRA_KEY}"
              else
                echo "##vso[task.logissue type=error]CONFIGURATION AUDIT FAILURE: No Jira issue key found. Controlled Goods and IEEE 828 standards mandate an active tracking ticket."
                exit 1
              fi

              SHORT_SHA=$(git rev-parse --short=7 HEAD)
              TARGET_TAG="$(Build.BuildId)-${SHORT_SHA}"

              echo "Commit SHA:       ${SHORT_SHA}"
              echo "Release Tag:      ${TARGET_TAG}"
              echo "Canonical Branch: ${BRANCH_NAME}"
              echo "Target SIL Node:  $(DEPLOY_SIL_AGENT_NAME) ($(DEPLOY_HOST_IP))"

              # Export cross-stage variables
              echo "##vso[task.setvariable variable=JIRA_KEY;isOutput=true]${JIRA_KEY}"
              echo "##vso[task.setvariable variable=SHORT_SHA;isOutput=true]${SHORT_SHA}"
              echo "##vso[task.setvariable variable=TARGET_RELEASE_TAG;isOutput=true]${TARGET_TAG}"
            name: AuditVars
            displayName: 'Extract Commit & Jira Metadata'

  # =========================================================================
  # STAGE 2: .NET 10 RESTORE, BUILD, TEST & SONARQUBE SAST
  # =========================================================================
  - stage: BuildAndTest
    displayName: 'Stage 2: .NET 10 Build, Test & SAST'
    dependsOn: AuditGate
    condition: and(succeeded(), eq('${{ parameters.ENABLE_BUILD_AND_TEST }}', 'true'))
    jobs:
      - job: DotNetBuildAndSonar
        displayName: 'Deterministic Build & SonarQube Gate'
        steps:
          - checkout: self
          - bash: |
              set -euo pipefail
              echo "=== [STAGE 2] DETERMINISTIC RESTORE, BUILD & SAST ==="
              
              # Diagnostic check: ensure credentials are not empty strings
              if [ -z "${NEXUS_USER:-}" ] || [ -z "${NEXUS_PASS:-}" ]; then
                echo "##vso[task.logissue type=error]NEXUS_USER or NEXUS_PASS is empty. Check Azure DevOps variable group / pipeline secrets."
                exit 1
              fi

              # Authenticate Docker to local Nexus OCI registry
              echo "$NEXUS_PASS" | docker login -u "$NEXUS_USER" --password-stdin "$(REGISTRY_HOST)"
              trap 'docker logout "$(REGISTRY_HOST)" 2>/dev/null || true' EXIT

              HOST_UID=$(id -u)
              HOST_GID=$(id -g)

              docker run --rm \
                --user root \
                --network host \
                -v "$(Build.SourcesDirectory):/workspace" \
                -w /workspace \
                --tmpfs /tmp:rw,exec,nosuid,size=2048m \
                -e HOME=/tmp \
                -e DOTNET_CLI_HOME=/tmp/.dotnet \
                -e NUGET_PACKAGES=/tmp/.nuget/packages \
                -e PATH="/usr/local/bin:/usr/bin:/bin" \
                -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
                -e ContinuousIntegrationBuild=true \
                -e SONAR_TOKEN="${SONAR_TOKEN}" \
                -e SONAR_HOST_URL="$(SONAR_HOST_URL)" \
                -e SONAR_PROJECT_KEY="$(SONAR_PROJECT_KEY)" \
                "$(DOTNET_BUILDER_IMAGE)" \
                bash -c '
                  set -euo pipefail
                  chmod -R a+rx /usr/local/bin/.store/dotnet-sonarscanner 2>/dev/null || true

                  dotnet restore MissionControl.sln --locked-mode --configfile nuget.config
                  
                  dotnet-sonarscanner begin \
                    /k:"${SONAR_PROJECT_KEY}" \
                    /d:sonar.host.url="${SONAR_HOST_URL}" \
                    /d:sonar.token="${SONAR_TOKEN}" \
                    /d:sonar.cs.vstest.reportsPaths="/workspace/TestResults/*.trx" \
                    /d:sonar.cs.opencover.reportsPaths="/workspace/TestResults/**/coverage.opencover.xml" \
                    /d:sonar.qualitygate.wait=true \
                    /d:sonar.scanner.scanAll=false

                  dotnet build MissionControl.sln -c Release --no-restore /p:TreatWarningsAsErrors=true /p:ContinuousIntegrationBuild=true /p:Deterministic=true

                  mkdir -p /workspace/TestResults
                  dotnet test tests/MissionControl.Tests/MissionControl.Tests.csproj \
                   -c Release --no-build \
                   --logger "trx;LogFileName=test_results.trx" \
                   --results-directory /workspace/TestResults \
                   --collect:"XPlat Code Coverage" \
                   -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

                  dotnet-sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

                  rm -rf /workspace/publish_raw
                  dotnet publish src/MissionControl.Api/MissionControl.Api.csproj -c Release --no-restore -o /workspace/publish_raw /p:ContinuousIntegrationBuild=true /p:UseAppHost=false

                  chown -R '"${HOST_UID}:${HOST_GID}"' /workspace
                '
            displayName: 'Containerized .NET Build, Test & SAST'
            env:
              # CRITICAL: These must match your Azure DevOps Pipeline Variables / Variable Groups exactly
              NEXUS_USER: $(NEXUS_USER)
              NEXUS_PASS: $(NEXUS_PASS)
              SONAR_TOKEN: $(SONAR_TOKEN)          

          - task: PublishPipelineArtifact@1
            displayName: 'Stash Raw Publish Output'
            inputs:
              targetPath: '$(Build.SourcesDirectory)/publish_raw'
              artifact: 'publish_raw'

          - task: PublishTestResults@2
            displayName: 'Publish VSTest TRX Results'
            condition: always()
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '**/test_results.trx'
              searchFolder: '$(Build.SourcesDirectory)/TestResults'
              failTaskOnFailedTests: true

  # =========================================================================
  # STAGE 3: PUBLISH RAW BINARY RELEASE ARCHIVE TO NEXUS
  # =========================================================================
  - stage: PublishRawRelease
    displayName: 'Stage 3: Publish Raw Release Archive'
    dependsOn:
      - AuditGate
      - BuildAndTest
    condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master'), eq('${{ parameters.ENABLE_RAW_RELEASE_PUBLISH }}', 'true'))
    variables:
      TARGET_RELEASE_TAG: $[ stageDependencies.AuditGate.AssertTraceability.outputs['AuditVars.TARGET_RELEASE_TAG'] ]
    jobs:
      - job: PackageAndUploadRaw
        displayName: 'Package Tarball & Push to Nexus'
        steps:
          - checkout: self

          - task: DownloadPipelineArtifact@2
            displayName: 'Fetch Raw Publish Output'
            inputs:
              artifact: 'publish_raw'
              path: '$(Build.SourcesDirectory)/publish_raw'

          - bash: |
              set -euo pipefail
              echo "=== [STAGE 3] PACKAGING RAW RELEASE BINARIES ==="
              RELEASE_DIR="$(Build.SourcesDirectory)/release_dist"
              mkdir -p "${RELEASE_DIR}"

              ARTIFACT_NAME="mission-control-api-$(TARGET_RELEASE_TAG).tar.gz"
              CHECKSUM_NAME="${ARTIFACT_NAME}.sha256"

              echo "--> Compressing binary release archive..."
              tar -czf "${RELEASE_DIR}/${ARTIFACT_NAME}" -C "$(Build.SourcesDirectory)/publish_raw" .

              cd "${RELEASE_DIR}"
              sha256sum "${ARTIFACT_NAME}" > "${CHECKSUM_NAME}"

              UPLOAD_URL="$(NEXUS_RAW_BASE)/sensor-gateway/$(Build.BuildId)"

              echo "--> Uploading binary package to Nexus raw feed..."
              curl -s -f -u "$NEXUS_USER:$NEXUS_PASS" \
                --upload-file "${ARTIFACT_NAME}" \
                "${UPLOAD_URL}/${ARTIFACT_NAME}"

              echo "--> Uploading SHA-256 verification hash..."
              curl -s -f -u "$NEXUS_USER:$NEXUS_PASS" \
                --upload-file "${CHECKSUM_NAME}" \
                "${UPLOAD_URL}/${CHECKSUM_NAME}"
            displayName: 'Publish .tar.gz and SHA-256'
            env:
              NEXUS_USER: $(NEXUS_USER)
              NEXUS_PASS: $(NEXUS_PASS)

  # =========================================================================
  # STAGE 4: CONTAINER SECURITY GATE & MULTI-ARCH PUBLISH
  # =========================================================================
  - stage: SecurityAndContainerPublish
    displayName: 'Stage 4: Trivy Scan & Container Publish'
    dependsOn:
      - AuditGate
      - BuildAndTest
    condition: and(succeeded(), eq('${{ parameters.ENABLE_CONTAINER_PUBLISH }}', 'true'))
    variables:
      TARGET_RELEASE_TAG: $[ stageDependencies.AuditGate.AssertTraceability.outputs['AuditVars.TARGET_RELEASE_TAG'] ]
      SHORT_SHA: $[ stageDependencies.AuditGate.AssertTraceability.outputs['AuditVars.SHORT_SHA'] ]
    jobs:
      - job: ContainerTrivyAndPush
        displayName: 'Trivy Scan & Nexus Multi-Arch Push'
        steps:
          - checkout: self

          - bash: |
              set -euo pipefail
              LOCAL_SCAN_TAG="$(IMAGE_NAME):scan-$(Build.BuildId)"

              echo "--> Building candidate container image (Chiseled base)..."
              docker build \
                --build-arg BUILD_NUMBER=$(Build.BuildId) \
                --build-arg GIT_COMMIT=$(SHORT_SHA) \
                -t "${LOCAL_SCAN_TAG}" \
                -f Dockerfile .

              if [ "${{ parameters.ENABLE_TRIVY_SCAN }}" = "true" ]; then
                echo "--> [V&V Security Gate] Executing Aquasec Trivy container scan (--exit-code 1)..."
                docker run --rm \
                  -v /var/run/docker.sock:/var/run/docker.sock \
                  aquasec/trivy:latest image \
                  --severity HIGH,CRITICAL \
                  --scanners vuln,secret \
                  --exit-code 1 \
                  --format table \
                  "${LOCAL_SCAN_TAG}"
              fi

              # Clean local scan tag
              docker rmi "${LOCAL_SCAN_TAG}" 2>/dev/null || true

              # Publish Multi-Arch Image (amd64 + arm64) on main/master
              if [[ "$(Build.SourceBranch)" == "refs/heads/main" || "$(Build.SourceBranch)" == "refs/heads/master" ]]; then
                echo "--> Authenticating to private Nexus OCI registry..."
                echo "$NEXUS_PASS" | docker login -u "$NEXUS_USER" --password-stdin "$(REGISTRY_HOST)"
                trap 'docker logout "$(REGISTRY_HOST)"' EXIT

                echo "--> Building and pushing multi-architecture release images (amd64, arm64)..."
                docker buildx build \
                  --platform linux/amd64,linux/arm64 \
                  --build-arg BUILD_NUMBER=$(Build.BuildId) \
                  --build-arg GIT_COMMIT=$(SHORT_SHA) \
                  -t "$(REGISTRY_HOST)/$(IMAGE_NAME):$(TARGET_RELEASE_TAG)" \
                  -t "$(REGISTRY_HOST)/$(IMAGE_NAME):latest" \
                  --push \
                  -f Dockerfile .

                docker builder prune -f --filter "until=24h"
              fi
            displayName: 'Scan with Trivy & Push Multi-Arch Image'
            env:
              NEXUS_USER: $(NEXUS_USER)
              NEXUS_PASS: $(NEXUS_PASS)

  # =========================================================================
  # STAGE 4.5 & 5: RELEASE READINESS REVIEW & SIL ANSIBLE CUTOVER
  # =========================================================================
  - stage: DeployToSIL
    displayName: 'Stage 5: SIL Hardware Cutover'
    dependsOn:
      - AuditGate
      - SecurityAndContainerPublish
    condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master'), ne('${{ parameters.DEPLOY_STRATEGY }}', 'SKIP'))
    variables:
      TARGET_RELEASE_TAG: $[ stageDependencies.AuditGate.AssertTraceability.outputs['AuditVars.TARGET_RELEASE_TAG'] ]
      JIRA_KEY: $[ stageDependencies.AuditGate.AssertTraceability.outputs['AuditVars.JIRA_KEY'] ]
    jobs:
      # Azure DevOps Environment with configured Approvals & Checks acts as Stage 4.5 RRR Gate
      - deployment: SILAnsibleDeployment
        displayName: 'Controlled Blue/Green Hardware Cutover'
        environment: 'production-sil' # Configure manual reviewers & wait timeouts in ADO Environment settings
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                # Step A: Post Jira Notification that artifact is promoted
                - bash: |
                    set -euo pipefail
                    CURL_CONF=$(mktemp)
                    chmod 600 "${CURL_CONF}"
                    trap 'rm -f "${CURL_CONF}"' EXIT INT TERM

                    AUTH_B64=$(printf "%s:%s" "$JIRA_USER" "$JIRA_TOKEN" | base64 | tr -d '\n')
                    echo "header = \"Authorization: Basic ${AUTH_B64}\"" > "${CURL_CONF}"

                    COMMENT="📋 RELEASE READINESS GATE: Azure DevOps Run [#$(Build.BuildId)|$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)] passed SonarQube SAST, unit tests, and Trivy CVE gating.\n\nArtifact [$(TARGET_RELEASE_TAG)] staged in Nexus and authorized for SIL hardware cutover [$(DEPLOY_SIL_AGENT_NAME)]."

                    curl -s -f -X POST \
                      -K "${CURL_CONF}" \
                      -H "Accept: application/json" \
                      -H "Content-Type: application/json" \
                      -d "{\"body\": \"${COMMENT}\"}" \
                      "$(JIRA_API_URL)/$(JIRA_KEY)/comment" || echo "##vso[task.logissue type=warning]Jira comment failed."
                  displayName: 'Notify Jira of RRR Approval'
                  env:
                    JIRA_USER: $(JIRA_USER)
                    JIRA_TOKEN: $(JIRA_TOKEN)

                # Step B: Execute Ansible Blue/Green Cutover
                - bash: |
                    set -euo pipefail
                    echo "=== [STAGE 5] ANSIBLE BLUE/GREEN CUTOVER ON SIL TARGET ==="
                    
                    KEY_TMP="./id_rsa_deploy"
                    VAULT_TMP="./vault_pass_tmp"

                    echo "$SIL_SSH_KEY" > "${KEY_TMP}"
                    echo "$VAULT_PASS" > "${VAULT_TMP}"
                    chmod 600 "${KEY_TMP}" "${VAULT_TMP}"
                    trap 'shred -u -z -n 3 "${KEY_TMP}" "${VAULT_TMP}" 2>/dev/null || rm -f "${KEY_TMP}" "${VAULT_TMP}"' EXIT INT TERM

                    CURRENT_ACTIVE=$(ssh -i "${KEY_TMP}" -o StrictHostKeyChecking=accept-new $(DEPLOY_HOST_USER)@$(DEPLOY_HOST_IP) "cat /opt/mission-control/active_slot 2>/dev/null || echo 'blue'")
                    echo "--> Baseline active slot on target SIL node: [${CURRENT_ACTIVE}]"

                    docker run --rm \
                      -v "$(Build.SourcesDirectory):/workspace" \
                      -e ANSIBLE_HOST_KEY_CHECKING=False \
                      -w /workspace \
                      alpine/ansible:latest \
                      ansible-playbook -i ansible/inventory.ini ansible/deploy.yml \
                        --private-key "/workspace/${KEY_TMP#./}" \
                        --vault-password-file "/workspace/${VAULT_TMP#./}" \
                        -u "$(DEPLOY_HOST_USER)" \
                        -e "target_tag=$(TARGET_RELEASE_TAG)"
                  displayName: 'Execute Ansible Deployment'
                  env:
                    SIL_SSH_KEY: $(SIL_NODE_SSH_KEY)
                    VAULT_PASS: $(ANSIBLE_VAULT_PASSWORD)

  # =========================================================================
  # STAGE 7: INGRESS VERIFICATION & TWO-PHASE RECOVERY LADDER
  # =========================================================================
  - stage: VerifyAndRecover
    displayName: 'Stage 7: Ingress Verification & Recovery'
    dependsOn:
      - AuditGate
      - DeployToSIL
    condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master'), eq('${{ parameters.ENABLE_INGRESS_HEALTH_CHECK }}', 'true'))
    variables:
      TARGET_RELEASE_TAG: $[ stageDependencies.AuditGate.AssertTraceability.outputs['AuditVars.TARGET_RELEASE_TAG'] ]
      JIRA_KEY: $[ stageDependencies.AuditGate.AssertTraceability.outputs['AuditVars.JIRA_KEY'] ]
      SHORT_SHA: $[ stageDependencies.AuditGate.AssertTraceability.outputs['AuditVars.SHORT_SHA'] ]
    jobs:
      - job: IngressProbeAndRecovery
        displayName: 'Health Probe & Automated Recovery'
        steps:
          - checkout: self

          - bash: |
              set -euo pipefail
              HEALTH_URL="http://$(DEPLOY_HOST_IP):$(INGRESS_PORT)$(HEALTH_CHECK_ENDPOINT)"
              echo "=== [STAGE 7] POLLING INGRESS ENDPOINT: ${HEALTH_URL} ==="

              if curl --fail --retry 5 --retry-delay 2 --max-time 5 "${HEALTH_URL}"; then
                echo "SUCCESS: Primary ingress probe verified."
                exit 0
              fi

              echo "##vso[task.logissue type=warning]Primary verification failed! Invoking Phase 1 automated rollback..."
              
              KEY_TMP="./id_rsa_deploy"
              VAULT_TMP="./vault_pass_tmp"
              echo "$SIL_SSH_KEY" > "${KEY_TMP}"
              echo "$VAULT_PASS" > "${VAULT_TMP}"
              chmod 600 "${KEY_TMP}" "${VAULT_TMP}"
              trap 'shred -u -z -n 3 "${KEY_TMP}" "${VAULT_TMP}" 2>/dev/null || rm -f "${KEY_TMP}" "${VAULT_TMP}"' EXIT INT TERM

              # Execute Phase 1 Rollback
              if docker run --rm \
                -v "$(Build.SourcesDirectory):/workspace" \
                -e ANSIBLE_HOST_KEY_CHECKING=False \
                -w /workspace \
                alpine/ansible:latest \
                ansible-playbook -i ansible/inventory.ini ansible/rollback.yml \
                  --private-key "/workspace/${KEY_TMP#./}" \
                  --vault-password-file "/workspace/${VAULT_TMP#./}" \
                  -u "$(DEPLOY_HOST_USER)"; then

                echo "Verifying restored fallback slot ingress..."
                if curl --fail --retry 3 --retry-delay 2 --max-time 5 "${HEALTH_URL}"; then
                  echo "RECOVERY CONFIRMED: Rollback succeeded. Target node operating in degraded mode."

                  # Notify Jira of Degraded Mode
                  CURL_CONF=$(mktemp)
                  chmod 600 "${CURL_CONF}"
                  AUTH_B64=$(printf "%s:%s" "$JIRA_USER" "$JIRA_TOKEN" | base64 | tr -d '\n')
                  echo "header = \"Authorization: Basic ${AUTH_B64}\"" > "${CURL_CONF}"

                  curl -s -f -X POST \
                    -K "${CURL_CONF}" \
                    -H "Accept: application/json" \
                    -H "Content-Type: application/json" \
                    -d "{\"body\": \"⚠️ DEGRADED DEPLOYMENT ALERT: Candidate [$(TARGET_RELEASE_TAG)] failed smoke test. Automated rollback succeeded. SIL node operating in DEGRADED SINGLE-SLOT MODE on previous baseline.\"}" \
                    "$(JIRA_API_URL)/$(JIRA_KEY)/comment" || true
                  rm -f "${CURL_CONF}"
                  exit 0
                fi
              fi

              echo "##vso[task.logissue type=error]CRITICAL DOUBLE FAULT: Rollback failed! Invoking Phase 2 Fail-Safe Lockdown..."
              docker run --rm \
                -v "$(Build.SourcesDirectory):/workspace" \
                -e ANSIBLE_HOST_KEY_CHECKING=False \
                -w /workspace \
                alpine/ansible:latest \
                ansible-playbook -i ansible/inventory.ini ansible/fail_safe.yml \
                  --private-key "/workspace/${KEY_TMP#./}" \
                  -u "$(DEPLOY_HOST_USER)"

              exit 1
            displayName: 'Execute Probe & Dynamic Recovery Ladder'
            env:
              SIL_SSH_KEY: $(SIL_NODE_SSH_KEY)
              VAULT_PASS: $(ANSIBLE_VAULT_PASSWORD)
              JIRA_USER: $(JIRA_USER)
              JIRA_TOKEN: $(JIRA_TOKEN)

  # =========================================================================
  # AUDIT SUMMARY: FINAL JIRA RECORDING
  # =========================================================================
  - stage: AuditSummary
    displayName: 'Stage 8: Delivery Audit Summary'
    dependsOn:
      - AuditGate
      - VerifyAndRecover
    condition: and(always(), in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master'))
    variables:
      TARGET_RELEASE_TAG: $[ stageDependencies.AuditGate.AssertTraceability.outputs['AuditVars.TARGET_RELEASE_TAG'] ]
      JIRA_KEY: $[ stageDependencies.AuditGate.AssertTraceability.outputs['AuditVars.JIRA_KEY'] ]
      SHORT_SHA: $[ stageDependencies.AuditGate.AssertTraceability.outputs['AuditVars.SHORT_SHA'] ]
    jobs:
      - job: RecordAuditTrail
        displayName: 'Post Audit Telemetry to Jira'
        steps:
          - checkout: none

          - bash: |
              set -euo pipefail
              CURL_CONF=$(mktemp)
              chmod 600 "${CURL_CONF}"
              trap 'rm -f "${CURL_CONF}"' EXIT INT TERM

              AUTH_B64=$(printf "%s:%s" "$JIRA_USER" "$JIRA_TOKEN" | base64 | tr -d '\n')
              echo "header = \"Authorization: Basic ${AUTH_B64}\"" > "${CURL_CONF}"

              DOCKER_REF="$(REGISTRY_HOST)/$(IMAGE_NAME):$(TARGET_RELEASE_TAG)"
              RAW_URL="$(NEXUS_RAW_BASE)/sensor-gateway/$(Build.BuildId)/mission-control-api-$(TARGET_RELEASE_TAG).tar.gz"

              PAYLOAD=$(cat <<EOF
              {
                "body": "*CONFIGURATION AUDIT: BASELINE DEPLOYED TO SIL*\nh4. Build & Delivery Telemetry\n* *Azure DevOps Run:* [#$(Build.BuildId)|$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)]\n* *Baseline Branch / Commit:* $(Build.SourceBranchName) / $(SHORT_SHA)\n* *Target SIL Node:* $(DEPLOY_SIL_AGENT_NAME) ($(DEPLOY_HOST_IP) - Active Slot)\n\nh4. Vetted Release Artifacts (Sonatype Nexus OSS)\n* *Container Registry:* [${DOCKER_REF}|http://${DOCKER_REF}]\n* *Raw Binary Archive:* [mission-control-api-$(TARGET_RELEASE_TAG).tar.gz|${RAW_URL}]\n* *Integrity Digest:* [SHA-256 Verification Hash|${RAW_URL}.sha256]\n\n_Audit baseline recorded for Controlled Goods and V&V compliance._"
              }
              EOF
              )

              curl -s -f -X POST \
                -K "${CURL_CONF}" \
                -H "Accept: application/json" \
                -H "Content-Type: application/json" \
                -d "${PAYLOAD}" \
                "$(JIRA_API_URL)/$(JIRA_KEY)/comment" || echo "##vso[task.logissue type=warning]Jira audit comment failed."
            displayName: 'Post Final Audit Baseline to Jira'
            env:
              JIRA_USER: $(JIRA_USER)
              JIRA_TOKEN: $(JIRA_TOKEN)